services:
  caddy:
    image: caddy:2-alpine
    container_name: spreadis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - spreadis
    depends_on:
      - frontend
      - backend
      - admin

  backend:
    image: ghcr.io/rinat85/spreadis-backend:latest
    container_name: spreadis-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Restrict cross-origin requests (HTTP + Socket.IO) to public frontend only.
      CORS_ORIGINS: https://spreadis.live,https://admin.spreadis.live
      # PostgreSQL connection for Prisma
      DATABASE_URL: postgresql://spreadis:${SPREADIS_DB_PASSWORD:-spreadis_secret}@spreadis-db:5432/spreadis?schema=public
    # Secrets: TG_BOT_TOKEN, TG_CHAT_ID, BETTERSTACK_WEBHOOK_SECRET
    # Defined in .env on the VPS (gitignored). required: false avoids
    # blocking deploys before the operator has populated .env — if it's
    # missing, the backend just starts without those vars and webhook-relay
    # logs a warning + skips Telegram send (other features still work).
    env_file:
      - path: .env
        required: false
    networks:
      - spreadis
    expose:
      - "3001"
    depends_on:
      spreadis-db:
        condition: service_healthy

  frontend:
    image: ghcr.io/rinat85/spreadis-frontend:latest
    container_name: spreadis-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_URL: https://api.spreadis.live
      NUXT_PUBLIC_WS_URL: wss://api.spreadis.live
    networks:
      - spreadis
    expose:
      - "3000"
    depends_on:
      - backend

  admin:
    image: ghcr.io/rinat85/spreadis-admin:latest
    container_name: spreadis-admin
    restart: unless-stopped
    networks:
      - spreadis
    expose:
      - "3002"
    depends_on:
      - backend

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: spreadis-umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:umami_secret_pw@umami-db:5432/umami
      APP_SECRET: spreadis-umami-secret-2026
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - spreadis

  spreadis-db:
    # TimescaleDB on top of PostgreSQL 16. Same data-directory layout as
    # the plain postgres:16-alpine image we used before, so the existing
    # spreadis-pgdata volume picks up in place — no dump/restore needed.
    # The 20260526000000_spread_ticks Prisma migration enables the
    # extension and converts spread_ticks into a hypertable.
    image: timescale/timescaledb:latest-pg16
    container_name: spreadis-db
    restart: unless-stopped
    # Force-preload the timescaledb library. The image only auto-configures
    # shared_preload_libraries during a FRESH initdb; we switched onto an
    # existing postgres:16 data dir, so that step was skipped and
    # `CREATE EXTENSION timescaledb` crashed the connection (P1017). The
    # explicit `-c` flag makes postgres load the library on every start
    # regardless of what's in the data dir's postgresql.conf.
    command: postgres -c shared_preload_libraries=timescaledb
    environment:
      POSTGRES_DB: spreadis
      POSTGRES_USER: spreadis
      POSTGRES_PASSWORD: ${SPREADIS_DB_PASSWORD:-spreadis_secret}
    volumes:
      - spreadis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreadis"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spreadis

  umami-db:
    image: postgres:15-alpine
    container_name: spreadis-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_secret_pw
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spreadis

networks:
  spreadis:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  spreadis-pgdata:
  umami-data: